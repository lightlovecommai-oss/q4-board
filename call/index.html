<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>銷講前電訪清單</title>
<style>
:root{
  --paper:#FDF8F3; --card:#FFFFFF; --peach:#FDF0E6; --ink:#4A3428;
  --ink-soft:#857A70; --rust:#C1553A; --gold:#D4A34A; --green:#6B8A72;
  --blue:#5B7A99; --line:#EDE2D6; --fs:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  line-height:1.65;padding-bottom:4rem;overflow-x:hidden}
.wrap{max-width:52rem;margin:0 auto;padding:0 .9rem}

/* ── 通行碼閘門 ── */
.gate{position:fixed;inset:0;background:var(--paper);z-index:90;display:flex;
  align-items:center;justify-content:center;padding:1.2rem}
.gate.off{display:none}
.gbox{max-width:22rem;width:100%;text-align:center}
.gbox h2{font-size:1.05rem;margin:0 0 .2rem}
.gbox p{font-size:.8rem;color:var(--ink-soft);margin:0 0 1rem}
.gbox input{font:inherit;font-size:1rem;width:100%;padding:.6rem .7rem;text-align:center;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gbox input:focus{outline:none;border-color:var(--gold)}
.gbox button{font:inherit;font-size:.92rem;width:100%;margin-top:.5rem;padding:.6rem;
  border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;font-weight:600}
.gbox label{display:flex;align-items:center;gap:.4rem;justify-content:center;
  font-size:.78rem;color:var(--ink-soft);margin-top:.7rem}
.gerr{font-size:.8rem;color:var(--rust);min-height:1.2rem;margin-top:.45rem}

/* ── 頂部 ── */
.top{position:sticky;top:0;z-index:30;background:rgba(253,248,243,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding:.7rem .9rem .6rem}
h1{font-size:1.12rem;margin:0 0 .15rem;letter-spacing:.01em}
h1 small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:400;
  letter-spacing:.06em;margin-top:.15rem}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:.5rem 0 .35rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rust));
  border-radius:99px;transition:width .3s}
.cnt{font-size:.78rem;color:var(--ink-soft);display:flex;gap:.9rem;flex-wrap:wrap;align-items:center}
.cnt b{color:var(--rust);font-size:1rem}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.55rem}
.tools button{font:inherit;font-size:.76rem;padding:.3rem .6rem;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);border-radius:99px;cursor:pointer;white-space:nowrap}
.tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── 卡 ── */
.evh{font-size:.82rem;letter-spacing:.1em;color:var(--ink-soft);font-weight:600;
  margin:1.6rem 0 .6rem;padding-bottom:.35rem;border-bottom:1px solid var(--line)}
.evh em{font-style:normal;color:var(--rust)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:.5rem;overflow:hidden}
.card[data-status="已完成"]{opacity:.62}
.card[data-status="已完成"] .head{background:#F4F7F4}
.card[data-status="不用追"]{opacity:.45}
.card.hide{display:none}
.head{display:flex;align-items:center;gap:.5rem;padding:.7rem .85rem;cursor:pointer;
  justify-content:space-between}
.hleft{min-width:0;flex:1}
.nm{font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.sn{font-size:.68rem;color:var(--ink-soft);font-weight:400;letter-spacing:.04em;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:.05rem .3rem}
.ph{font-size:.88rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:.1rem}
.tag{font-size:.64rem;font-weight:500;padding:.08rem .35rem;border-radius:4px;letter-spacing:.02em}
.tag.intl{background:#EEF2F6;color:var(--blue)}
.tag.dupe{background:#FBEEE9;color:var(--rust)}
.tag.has-msg{background:#FBF3E0;color:#9A7A2E}
.hright{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.badge{font-size:.7rem;padding:.15rem .45rem;border-radius:99px;background:var(--paper);
  border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.badge[data-s="已完成"]{background:#E8F0E8;border-color:#C5D8C5;color:#44663F}
.badge[data-s="沒接到"]{background:#FBEEE9;border-color:#EFCFC4;color:var(--rust)}
.badge[data-s="改約時間"]{background:#FBF3E0;border-color:#E8D5A8;color:#8A6A1E}
.caret{color:var(--ink-soft);font-size:.8rem;transition:transform .2s}
.card.open-c .caret{transform:rotate(180deg)}
.body{display:none;padding:0 .85rem 1rem;border-top:1px solid var(--line)}
.card.open-c .body{display:block}

.acts{display:flex;gap:.4rem;margin:.75rem 0 .6rem}
.btn{font:inherit;font-size:.82rem;padding:.42rem .9rem;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;
  display:inline-block}
.btn.call{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.known{display:flex;flex-wrap:wrap;gap:.3rem .5rem;font-size:.76rem;color:var(--ink-soft);
  background:var(--paper);border-radius:8px;padding:.5rem .6rem;word-break:break-all}
.known i{font-style:normal;color:#B5A79A;margin-right:.3rem}
.msg{margin-top:.5rem;background:#FBF3E0;border-left:3px solid var(--gold);
  border-radius:0 8px 8px 0;padding:.55rem .7rem;font-size:.85rem}
.msg i{display:block;font-style:normal;font-size:.68rem;letter-spacing:.08em;
  color:#9A7A2E;margin-bottom:.2rem}
details.open{margin:.6rem 0 .2rem}
details.open summary{font-size:.76rem;color:var(--blue);cursor:pointer;letter-spacing:.04em}
details.open pre{white-space:pre-wrap;font:inherit;font-size:.84rem;background:#EEF2F6;
  border-radius:8px;padding:.6rem .7rem;margin:.4rem 0 0;color:#3F566B}

/* ── 題 ── */
.q{margin-top:.85rem}
.qlab{font-size:.92rem;font-weight:600}
.qlab b{color:var(--rust);font-weight:700;margin-right:.15rem}
.qhint{font-size:.72rem;color:var(--ink-soft);margin-top:.1rem;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.chip{font:inherit;font-size:.8rem;padding:.3rem .65rem;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips.st .chip.on{background:var(--rust);border-color:var(--rust)}
input.sub,textarea.area,input.num{font:inherit;font-size:.88rem;width:100%;margin-top:.35rem;
  padding:.42rem .55rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);resize:vertical}
input.sub:focus,textarea.area:focus,input.num:focus{outline:none;border-color:var(--gold);
  background:#fff}
textarea.star{border-left:3px solid var(--rust);background:#FFFCFB;min-height:3.4rem}
.ratio{display:flex;align-items:center;gap:.4rem;margin-top:.35rem;font-size:.82rem;
  color:var(--ink-soft)}
.ratio input.num{width:4.2rem;margin:0;text-align:center;font-variant-numeric:tabular-nums}
.judge{margin-top:1.1rem;background:var(--peach);border-radius:10px;padding:.2rem .7rem .8rem}
.jt{font-size:.74rem;letter-spacing:.1em;color:var(--rust);font-weight:600;padding-top:.7rem}
.judge .q{margin-top:.7rem}
.stat{margin-top:.9rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.stat>span{font-size:.74rem;letter-spacing:.08em;color:var(--ink-soft)}

/* ── 匯出 ── */
.ov{position:fixed;inset:0;background:rgba(74,52,40,.45);z-index:60;display:none;
  align-items:center;justify-content:center;padding:1rem}
.ov.on{display:flex}
.ovb{background:var(--card);border-radius:12px;max-width:44rem;width:100%;max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden}
.ovh{padding:.8rem .9rem;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;font-weight:600;font-size:.92rem;gap:.5rem}
.ovb textarea{flex:1;border:0;padding:.9rem;font-family:ui-monospace,Menlo,monospace;
  font-size:.76rem;line-height:1.6;resize:none;background:var(--paper);color:var(--ink)}
.ovf{padding:.7rem .9rem;border-top:1px solid var(--line);display:flex;gap:.4rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,1.5rem);z-index:80;
  background:var(--ink);color:#fff;font-size:.82rem;padding:.5rem .95rem;border-radius:99px;
  opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="gbox">
  <h2>銷講前電訪清單</h2>
  <p>名單含報名者個資，請輸入通行碼</p>
  <input id="g-in" type="password" inputmode="text" autocomplete="current-password"
         placeholder="通行碼">
  <div class="gerr" id="g-err"></div>
  <button id="g-go">解鎖</button>
  <label><input type="checkbox" id="g-rem" checked> 記住這台裝置</label>
</div></div>

<div id="app" hidden>
  <div class="top"><div class="wrap">
    <h1>銷講前電訪清單<small>明明很專業，為什麼沒人買單？／路隊長通路</small></h1>
    <div class="bar"><i id="pbar"></i></div>
    <div class="cnt">
      <span><b id="n-done">0</b> / 37 已完成</span>
      <span id="n-rest"></span>
      <span id="n-hot"></span>
    </div>
    <div class="tools">
      <button data-f="all" class="on">全部</button>
      <button data-f="10/13">10/13</button>
      <button data-f="10/23">10/23</button>
      <button data-f="todo">只看沒打完</button>
      <button id="t-next">跳到下一通</button>
      <button id="t-exp">匯出</button>
      <button id="t-font">放大字</button>
    </div>
  </div></div>
  <div class="wrap" id="list"></div>
</div>

<div class="ov" id="ov"><div class="ovb">
  <div class="ovh"><span>匯出（貼回對話就能進 CRM）</span>
    <button class="btn" id="ov-x">關閉</button></div>
  <textarea id="ov-t" readonly></textarea>
  <div class="ovf">
    <button class="btn" id="ov-c">複製全部</button>
    <button class="btn" id="ov-csv">下載 CSV</button>
    <button class="btn" id="ov-mode">切成 CSV</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

/* ══ 解密 ══ */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),
    'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decryptWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pass,remember){
  const key=await deriveKey(pass,b64(ENC.salt),ENC.iter);
  const data=await decryptWith(key);                 // 失敗會 throw
  if(remember)localStorage.setItem(KKEY,
    JSON.stringify(await crypto.subtle.exportKey('jwk',key)));
  return data;
}
async function tryRemembered(){
  const raw=localStorage.getItem(KKEY);if(!raw)return null;
  try{
    const key=await crypto.subtle.importKey('jwk',JSON.parse(raw),
      {name:'AES-GCM',length:256},true,['decrypt']);
    return await decryptWith(key);
  }catch(e){localStorage.removeItem(KKEY);return null;}
}

/* ══ 畫面 ══ */
function qHTML(p,q){
  const k=p.id+'|'+q.id;
  let h=`<div class="q"><div class="qlab"><b>${q.id}</b> ${esc(q.label)}</div>`;
  if(q.hint)h+=`<div class="qhint">${esc(q.hint)}</div>`;
  if(q.kind==='multi'||q.kind==='single'){
    h+=`<div class="chips" data-k="${esc(k)}" data-mode="${q.kind}">`+
       q.opts.map(o=>`<button type="button" class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join('')+
       `</div><input class="sub" data-k="${esc(k)}|note" placeholder="補充…">`;
  }else if(q.kind==='ratio'){
    h+=`<div class="ratio"><input class="num" data-k="${esc(k)}|talk" inputmode="numeric" placeholder="談">`+
       `<span>談 →</span><input class="num" data-k="${esc(k)}|deal" inputmode="numeric" placeholder="成">`+
       `<span>成交</span></div>`;
  }else if(q.kind==='text'){
    h+=`<input class="sub" data-k="${esc(k)}" placeholder="打字…">`;
  }else{
    h+=`<textarea class="area${q.kind==='star'?' star':''}" data-k="${esc(k)}" rows="2" placeholder="打字…"></textarea>`;
  }
  return h+'</div>';
}
function cardHTML(p){
  let h=`<article class="card" id="c-${p.id}" data-id="${p.id}" data-event="${p.ev}" data-status="未撥">`;
  h+=`<header class="head"><div class="hleft"><div class="nm">`+
     `<span class="sn">${p.id}</span>${esc(p.name)}`+
     (p.intl?'<span class="tag intl">國際號碼</span>':'')+
     (p.dupe?`<span class="tag dupe">重複報名 ×${p.dupe+1}</span>`:'')+
     (p.msg?'<span class="tag has-msg">留了話</span>':'')+
     `</div><div class="ph">${esc(p.phone)}</div></div>`+
     `<div class="hright"><span class="badge">未撥</span><span class="caret">▾</span></div></header>`;

  h+='<div class="body"><div class="acts">';
  if(p.tel)h+=`<a class="btn call" href="tel:${esc(p.tel)}">撥號</a>`;
  h+=`<button type="button" class="btn" data-copy="${esc(p.phone)}">複製號碼</button></div>`;

  const known=[['報名',p.signup],['性別',p.sex],['年齡',p.age],['LINE',p.line],
               ['從哪知道',p.src],['Email',p.email],['常用 Email',p.email2]];
  h+='<div class="known">'+known.filter(([,v])=>v)
      .map(([l,v])=>`<span><i>${l}</i>${esc(v)}</span>`).join('')+'</div>';
  if(p.msg)h+=`<div class="msg"><i>他報名時留的話</i>${esc(p.msg).replace(/\n/g,'<br>')}</div>`;
  h+=`<details class="open"><summary>開場話術</summary><pre>${esc(CFG.opening)}</pre></details>`;
  h+=CFG.questions.map(q=>qHTML(p,q)).join('');

  h+='<div class="judge"><div class="jt">訪員判定（掛掉電話再填）</div>';
  CFG.judge.forEach(j=>{
    const k=p.id+'|J-'+j.label;
    h+=`<div class="q"><div class="qlab">${esc(j.label)}</div>`+
       `<div class="qhint">${esc(j.hint)}</div>`+
       `<div class="chips" data-k="${esc(k)}" data-mode="single">`+
       j.opts.map(o=>`<button type="button" class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join('')+
       '</div></div>';
  });
  h+=`<textarea class="area" data-k="${p.id}|J-備註" rows="2" placeholder="其他備註…"></textarea></div>`;

  h+=`<div class="stat"><span>這通的狀態</span><div class="chips st" data-k="${p.id}|STATUS" data-mode="single">`+
     CFG.status.map(s=>`<button type="button" class="chip" data-v="${esc(s)}">${esc(s)}</button>`).join('')+
     '</div></div></div></article>';
  return h;
}
function render(){
  let h='';
  CFG.events.forEach(e=>{
    const lst=PEOPLE.filter(p=>p.ev===e.ev);
    h+=`<h2 class="evh" data-event="${e.ev}">${e.when}　<em>${lst.length} 人</em></h2>`;
    h+=lst.map(cardHTML).join('');
  });
  $('#list').innerHTML=h;
  PEOPLE.forEach(p=>META[p.id]={name:p.name,ev:p.ev,phone:p.phone,email:p.email});
  restore();tally();applyFilter();
}
function restore(){
  $$('.chips').forEach(c=>{const v=S[c.dataset.k];if(!v)return;
    const arr=Array.isArray(v)?v:[v];
    c.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',arr.includes(b.dataset.v)));});
  $$('[data-k]').forEach(el=>{if(el.classList.contains('chips'))return;
    if(S[el.dataset.k]!=null)el.value=S[el.dataset.k];});
  $$('.card').forEach(c=>setStatus(c,S[c.dataset.id+'|STATUS']||'未撥'));
}
function setStatus(card,s){
  card.dataset.status=s;
  const b=card.querySelector('.badge');b.textContent=s;b.dataset.s=s;
}

/* ══ 互動 ══ */
document.addEventListener('click',e=>{
  const head=e.target.closest('.head');
  if(head&&!e.target.closest('.btn')){head.parentElement.classList.toggle('open-c');return;}
  const chip=e.target.closest('.chip');
  if(chip){
    const box=chip.closest('.chips'), k=box.dataset.k;
    if(box.dataset.mode==='single'){
      const was=chip.classList.contains('on');
      box.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
      if(!was){chip.classList.add('on');S[k]=chip.dataset.v;}else delete S[k];
    }else{
      chip.classList.toggle('on');
      S[k]=[...box.querySelectorAll('.chip.on')].map(b=>b.dataset.v);
      if(!S[k].length)delete S[k];
    }
    if(k.endsWith('|STATUS'))setStatus(chip.closest('.card'),S[k]||'未撥');
    save();tally();applyFilter();return;
  }
  const cp=e.target.closest('[data-copy]');
  if(cp)navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast('已複製 '+cp.dataset.copy));
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-k]');
  if(!el||el.classList.contains('chips'))return;
  if(el.value.trim())S[el.dataset.k]=el.value;else delete S[el.dataset.k];
  save();
});

function tally(){
  const cards=$$('.card'), n=cards.length;
  const done=cards.filter(c=>c.dataset.status==='已完成').length;
  const skip=cards.filter(c=>c.dataset.status==='不用追').length;
  const hot=Object.entries(S).filter(([k,v])=>k.endsWith('|J-1v1 值不值得約')&&v==='熱・優先約').length;
  $('#n-done').textContent=done;
  $('#pbar').style.width=(100*(done+skip)/n)+'%';
  $('#n-rest').textContent='剩 '+(n-done-skip)+' 通';
  $('#n-hot').textContent=hot?'🔥 '+hot+' 位優先約 1v1':'';
}
let F='all';
function applyFilter(){
  $$('.card').forEach(c=>{
    let show=true;
    if(F==='10/13'||F==='10/23')show=c.dataset.event===F;
    else if(F==='todo')show=!['已完成','不用追'].includes(c.dataset.status);
    c.classList.toggle('hide',!show);
  });
  $$('.evh').forEach(h=>{
    h.style.display=$$(`.card[data-event="${h.dataset.event}"]:not(.hide)`).length?'':'none';
  });
}

/* ══ 匯出 ══ */
const get=k=>{const v=S[k];return Array.isArray(v)?v.join('、'):(v||'');};
function rowOf(id){
  const m=META[id], r={編號:id,場次:m.ev,姓名:m.name,電話:m.phone,Email:m.email,
    狀態:get(id+'|STATUS')||'未撥'};
  CFG.questions.forEach(q=>{
    const k=id+'|'+q.id;
    if(q.kind==='ratio')r[q.id+' '+q.label]=(S[k+'|talk']||'?')+'談/'+(S[k+'|deal']||'?')+'成';
    else{let v=get(k);const n=get(k+'|note');if(n)v=v?v+'（'+n+'）':n;r[q.id+' '+q.label]=v;}
  });
  CFG.judge.forEach(j=>r[j.label]=get(id+'|J-'+j.label));
  r['備註']=get(id+'|J-備註');
  return r;
}
let csvMode=false;
function expText(){
  const ids=Object.keys(META).filter(id=>get(id+'|STATUS')==='已完成');
  if(!ids.length)return '（還沒有任何一通標成「已完成」）';
  return ids.map(id=>Object.entries(rowOf(id))
    .filter(([,v])=>v&&v!=='?談/?成').map(([k,v])=>k+'：'+v).join('\n'))
    .join('\n\n'+'—'.repeat(24)+'\n\n');
}
function expCsv(){
  const ids=Object.keys(META), hdr=Object.keys(rowOf(ids[0]));
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return [hdr.join(',')].concat(ids.map(id=>{const r=rowOf(id);
    return hdr.map(h=>q(r[h])).join(',');})).join('\n');
}
function paint(){$('#ov-t').value=csvMode?expCsv():expText();
  $('#ov-mode').textContent=csvMode?'切成純文字':'切成 CSV';}

function wire(){
  $$('.tools [data-f]').forEach(b=>b.onclick=()=>{
    $$('.tools [data-f]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');F=b.dataset.f;applyFilter();});
  $('#t-next').onclick=()=>{
    const next=$$('.card').find(c=>!['已完成','不用追'].includes(c.dataset.status));
    if(!next)return toast('全部打完了 🎉');
    $$('.card.open-c').forEach(c=>c.classList.remove('open-c'));
    next.classList.remove('hide');next.classList.add('open-c');
    next.scrollIntoView({behavior:'smooth',block:'center'});};
  const SIZES=['17px','19px','21px'];
  let si=+(localStorage.getItem(KEY+'-fs')||0);
  const fs=()=>{document.documentElement.style.setProperty('--fs',SIZES[si]);
    $('#t-font').textContent=['放大字','再放大','回到預設'][si];};
  $('#t-font').onclick=()=>{si=(si+1)%3;localStorage.setItem(KEY+'-fs',si);fs();};fs();
  $('#t-exp').onclick=()=>{csvMode=false;paint();$('#ov').classList.add('on');};
  $('#ov-x').onclick=()=>$('#ov').classList.remove('on');
  $('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('on');};
  $('#ov-mode').onclick=()=>{csvMode=!csvMode;paint();};
  $('#ov-c').onclick=()=>navigator.clipboard.writeText($('#ov-t').value).then(()=>toast('已複製'));
  $('#ov-csv').onclick=()=>{
    const b=new Blob(['﻿'+expCsv()],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='銷講前電訪-'+new Date().toISOString().slice(0,10)+'.csv';a.click();};
}

/* ══ 啟動 ══ */
function start(data){
  PEOPLE=data;$('#gate').classList.add('off');$('#app').hidden=false;render();wire();
}
(async()=>{
  if(!ENC){start(DATA);return;}
  const remembered=await tryRemembered();
  if(remembered){start(remembered);return;}
  const go=async()=>{
    const v=$('#g-in').value.trim();
    if(!v)return;
    $('#g-err').textContent='解密中…';
    try{start(await unlock(v,$('#g-rem').checked));}
    catch(e){$('#g-err').textContent='通行碼不對';$('#g-in').select();}
  };
  $('#g-go').onclick=go;
  $('#g-in').onkeydown=e=>{if(e.key==='Enter')go();};
  $('#g-in').focus();
})();
</script>
